replicaCount: 1
image: registry.gitlab.ics.muni.cz:443/cloud/g2/container-registry/docker.io__ubuntu:noble

logcli:
  address: http://osh-infra-loki-stack.osh-infra:3100
  architecture: linux-amd64
  tag: v3.2.1
  queryOverride: ""

persistence:
  enabled: false
  size: 1Gi
  storageClass:
  accessMode: ReadWriteOnce

initialLogPeriod: 24h
logRetention: 5m
selfHeal: false

logParsing:
  combinedQuery: '{application=~"nova|neutron|keystone|libvirt|rabbitmq|openvswitch",container!="libvirt-exporter"}'
  generic_regexps:
    errors: .*(^ERR |^ERROR | ERROR | ERR=| level=\"error\"| level=error |exception:| severity=error).*
    warnings: .*(^WARN |^WARNING | WARNING | WARN=| level=\"warning\"| level=warning).*
  programs: []
    #- name: rabbitmq
    #  query: '{application="rabbitmq",component="server"}'
    #  errors: true
    #  warnings: true
    #  patterns:
    #    - name: boot-failed
    #      regex: ".*BOOT FAILED.*"
    #  raw: |
    #    counter ...
