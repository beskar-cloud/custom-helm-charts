apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  labels:
    app.kubernetes.io/name: {{ .Release.Name }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app.kubernetes.io/name: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: {{ .Release.Name }}
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "3903"
    spec:
      containers:
        - name: {{ .Release.Name }}
          image: {{ .Values.image }}
          command: ["/app/entrypoint.sh"]
          ports:
            - containerPort: 3903
          volumeMounts:
            - name: entrypoint
              mountPath: /app
            - name: programs
              mountPath: /app/programs
            - name: logs
              mountPath: /app/logs
      volumes:
        - name: entrypoint
          configMap:
            name: {{ .Release.Name }}-entrypoint
            defaultMode: 0755
        - name: programs
          configMap:
            name: {{ .Release.Name }}-programs
        - name: logs
          {{- if .Values.persistence.enabled }}
          persistentVolumeClaim:
            claimName: {{ .Release.Name }}
          {{- else }}
          emptyDir:
            sizeLimit: {{ .Values.persistence.size }}
          {{- end }}
